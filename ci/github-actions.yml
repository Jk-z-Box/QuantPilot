name: safety-and-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: bash scripts/check.sh
      - run: python -m pip_audit -r requirements.lock --disable-pip
