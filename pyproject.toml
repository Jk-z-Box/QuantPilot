[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpilot"
version = "0.2.0"
description = "Paper-first multi-exchange quantitative trading console"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "cryptography>=43", "ccxt>=4.4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pip-audit>=2.7"]

[project.scripts]
qp = "quantpilot.cli:main"
quantpilot = "quantpilot.cli:main"

[tool.setuptools.package-data]
quantpilot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=quantpilot --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
